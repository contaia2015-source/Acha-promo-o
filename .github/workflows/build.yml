name: Compilar APK AchaPromo

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descarregar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Descompactar ficheiros do projeto
        run: unzip AchaPromo.zip

      - name: Compilar APK
        run: |
          cd AchaPromo
          gradle assembleDebug

      - name: Guardar o APK gerado
        uses: actions/upload-artifact@v4
        with:
          name: AchaPromo-debug-apk
          path: AchaPromo/app/build/outputs/apk/debug/*.apk
